<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận & Nhận Vé Tham Dự</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 550px;
        }

        h2 {
            color: #1e3c72;
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
            font-size: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #2a5298;
            box-shadow: 0 0 8px rgba(42, 82, 152, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #1e3c72;
        }

        .error-msg {
            color: #e74c3c;
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
        }

        /* Khung hiển thị vé Canvas */
        .ticket-container {
            display: none;
            margin-top: 25px;
            text-align: center;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
        }

        .action-btns {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .download-btn {
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 50%;
        }

        .download-btn:hover {
            background: #27ae60;
        }

        .print-btn {
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 50%;
        }

        .print-btn:hover {
            background: #d35400;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            .ticket-container, .ticket-container canvas {
                visibility: visible;
            }
            .ticket-container {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                display: block !important;
            }
            .action-btns {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>XÁC NHẬN VÉ THAM DỰ</h2>

    <div class="input-group">
        <label for="fullName">Nhập chính xác Họ và Tên của bạn đã điền form:</label>
        <input type="text" id="fullName" placeholder="Ví dụ: Nguyễn Văn A" onkeypress="handleKeyPress(event)">
    </div>

    <button onclick="checkAndGenerateTicket()">Tra Cứu & Nhận Vé</button>
    <div id="errorMsg" class="error-msg"></div>

    <div id="ticketContainer" class="ticket-container">
        <canvas id="ticketCanvas"></canvas>
        <div class="action-btns">
                    </div>
    </div>
</div>

        nameY_Ratio: 0.72,   // Nằm ở độ cao 45% (ngang tầm ngực/vai)
        
        seatX_Ratio: 0.92,   // Số ghế nằm căn lề PHẢI

        { name: "Nguyễn Thị Huyền Diệu", seat: "J11, J12" },
        { name: "Phạm Thị Mỹ Duyên", seat: "J13, J14" },
        { name: "Quách Như Ý", seat: "H12, G12" },
        { name: "Phan Nguyễn Trúc My", seat: "G1, E1" }
    ];

    // =========================================================================
    // XỬ LÝ TRA CỨU VÀ VẼ VÉ
    // =========================================================================
    let templateImage = new Image();
    templateImage.src = TICKET_IMAGE_SRC;

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            checkAndGenerateTicket();
        }
    }

    function normalizeText(text) {
        if (!text) return "";
        return text.toString()
            .trim()
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/đ/g, "d");
    }

    function checkAndGenerateTicket() {
        const inputName = document.getElementById('fullName').value;
        const errorMsg = document.getElementById('errorMsg');
        const ticketContainer = document.getElementById('ticketContainer');

        errorMsg.innerText = "";
        ticketContainer.style.display = "none";

        if (!inputName.trim()) {
            errorMsg.innerText = "Vui lòng nhập họ và tên của bạn!";
            return;
        }

        const normalizedInput = normalizeText(inputName);
        const foundUser = guestList.find(guest => normalizeText(guest.name) === normalizedInput);

        if (!foundUser) {
            errorMsg.innerText = "Không tìm thấy thông tin của bạn trong danh sách. Vui lòng kiểm tra lại!";
            return;
        }

        renderTicket(foundUser.name.toUpperCase(), foundUser.seat);
    }

    function renderTicket(name, seat) {
        const canvas = document.getElementById('ticketCanvas');
        const ctx = canvas.getContext('2d');

        const imgWidth = templateImage.width || 800;
        const imgHeight = templateImage.height || 1000;

        canvas.width = imgWidth;
        canvas.height = imgHeight;

        // 1. Vẽ phôi vé
        ctx.drawImage(templateImage, 0, 0, imgWidth, imgHeight);

        // Kích thước chữ tự co giãn theo ảnh
        const fontSize = Math.round(imgWidth * 0.038);

        // 2. In HỌ VÀ TÊN (Bên trái - Ngang vị trí ô vuông đỏ)
        const nameX = imgWidth * CONFIG.nameX_Ratio;
        const nameY = imgHeight * CONFIG.nameY_Ratio;

        ctx.font = `bold ${fontSize}px "Segoe UI", Arial, sans-serif`;
        ctx.fillStyle = CONFIG.textColor; 
        ctx.textAlign = 'left'; // Căn lề trái
        ctx.fillText(name, nameX, nameY);

        // 3. In SỐ GHẾ (Bên phải - Đối diện Họ tên)
        const seatX = imgWidth * CONFIG.seatX_Ratio;
        const seatY = imgHeight * CONFIG.seatY_Ratio;

        ctx.textAlign = 'right'; // Căn lề phải
        ctx.fillText('GHẾ: ' + seat, seatX, seatY);

        document.getElementById('ticketContainer').style.display = 'block';
    }

    function downloadTicket() {
        const canvas = document.getElementById('ticketCanvas');
        const inputName = document.getElementById('fullName').value || 'Ve_Tham_Du';
        
        const link = document.createElement('a');
        link.download = `Ve_${inputName.replace(/\s+/g, '_')}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
</script>
